name: 发布官网

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取代码
        uses: actions/checkout@v6

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查官网
        run: npm run lint

      - name: 生成静态官网
        run: npm run build:static

      - name: 准备 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传官网产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # 只上传 out；开启隐藏文件是为了把 .nojekyll 一并交给 Pages，避免静态资源路径被 Jekyll 处理。
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
